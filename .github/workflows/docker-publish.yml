name: Docker Build and Push

on:
  push:
    # ЗМІНЕНО: Додано pattern для всіх гілок: **
    branches: [ "**" ]
    tags: [ 'v*.*.*' ]
  # ЗМІНЕНО: Залишаємо pull_request, щоб не білдити двічі (push і PR)
  pull_request:
    branches: [ "**" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Дозвіл на запис у GitHub Packages

    steps:
      # 1. Завантаження коду репозиторію
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Логін у GitHub Container Registry
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 3. Генерація метаданих (тегів та лейблів) для Docker
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # 💡 ЗМІНЕНО: Додано логіку для робочих гілок (feature branches)
            # Прибираємо скісні риски та використовуємо назву гілки як тег (наприклад, feature-new-api)
            type=raw,value=${{ github.ref_name }},enable=${{ startsWith(github.ref, 'refs/heads/') }},event=push
            # Використовує тег git-версії (наприклад, v1.0.0)
            type=ref,event=tag
            # Використовує SHA коміта як резервний тег (за бажанням)
            # type=sha,format=short

      # 4. Збірка та пуш образу
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          # Пушимо образ лише для події 'push', а не 'pull_request'
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}